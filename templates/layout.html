{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}BattleHub{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
  </head>
  <body>
    <nav class="bg-white shadow-sm">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <a href="{% url 'tournaments:tournament_list' %}" class="font-semibold text-lg">BattleHub</a>
        </div>
        <div class="text-sm">
          {% if user.is_authenticated %}
            <a href="{% url 'accounts:logout' %}" class="text-gray-600 hover:text-gray-800">Logout</a>
          {% else %}
            <a href="{% url 'accounts:login' %}" class="text-gray-600 hover:text-gray-800">Login</a>
            <span class="mx-2 text-gray-300">|</span>
            <a href="{% url 'accounts:signup' %}" class="text-gray-600 hover:text-gray-800">Signup</a>
          {% endif %}
        </div>
      </div>
    </nav>

    {% if messages %}
      <div class="max-w-5xl mx-auto px-4 mt-4">
        {% for message in messages %}
          <div class="mb-2 rounded px-3 py-2 text-sm bg-white shadow-sm">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <main class="max-w-5xl mx-auto px-4 py-6">
      {% block content %}{% endblock %}
    </main>

    <footer class="max-w-5xl mx-auto px-4 py-6 text-sm text-gray-500">
      <div>BattleHub</div>
    </footer>
  </body>
</html>
