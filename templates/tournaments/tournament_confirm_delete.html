{% extends "base.html" %}
{% block content %}
<h2>Delete Tournament</h2>
<p>Are you sure you want to delete "{{ tournament.name }}"?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
  <a href="{% url 'tournaments:tournament_detail' tournament.pk %}" class="secondary">Cancel</a>
</form>
{% endblock %}
