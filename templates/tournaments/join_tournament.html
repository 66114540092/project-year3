{% extends "base.html" %}

{% block title %}Join Tournament · BattleHub{% endblock %}

{% block content %}
<style>
    .join-container {
        max-width: 500px;
        margin: 4rem auto;
        padding: 2rem;
    }

    .join-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 24px;
        padding: 3rem 2rem;
        text-align: center;
        box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4);
    }

    .join-title {
        font-size: 2.5rem;
        font-weight: 900;
        color: white;
        margin-bottom: 0.5rem;
    }

    .join-subtitle {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 2rem;
    }

    .pin-input {
        width: 100%;
        padding: 1.5rem;
        font-size: 2rem;
        font-weight: 700;
        text-align: center;
        letter-spacing: 0.5rem;
        border: none;
        border-radius: 16px;
        background: white;
        color: #667eea;
        margin-bottom: 1.5rem;
    }

    .pin-input::placeholder {
        color: rgba(102, 126, 234, 0.3);
        letter-spacing: 0.3rem;
    }

    .join-btn {
        width: 100%;
        padding: 1.25rem;
        font-size: 1.2rem;
        font-weight: 700;
        border: none;
        border-radius: 16px;
        background: white;
        color: #667eea;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .join-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .kahoot-logo {
        font-size: 3rem;
        margin-bottom: 1rem;
        animation: bounce 2s infinite;
    }

    @keyframes bounce {

        0%,
        100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-10px);
        }
    }
</style>

<div class="join-container">
    <div class="join-card">
        <div class="kahoot-logo">🎮</div>
        <h1 class="join-title">BattleHub</h1>
        <p class="join-subtitle">Enter PIN to join tournament</p>

        {% if messages %}
        {% for message in messages %}
        <div
            style="background: rgba(255,255,255,0.2); padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; color: white;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="pin" class="pin-input" placeholder="000000" maxlength="6" pattern="[0-9]{6}"
                required autofocus>
            <button type="submit" class="join-btn">
                Join Now
            </button>
        </form>
    </div>

    <div style="text-align: center; margin-top: 2rem;">
        <a href="{% url 'tournaments:tournament_list' %}" style="color: #aaa; text-decoration: none;">
            ← Back to Tournaments
        </a>
    </div>
</div>

<script>
    // Auto-format PIN input
    document.querySelector('.pin-input').addEventListener('input', function (e) {
        this.value = this.value.replace(/[^0-9]/g, '');
    });
</script>
{% endblock %}
