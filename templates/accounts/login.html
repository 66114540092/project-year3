{% extends "base.html" %}
{% block title %}Login · BattleHub{% endblock %}

{% block content %}
<style>
  /* Kahoot-style Login Page */
  .login-container {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .login-card {
    width: 100%;
    max-width: 420px;
    background: rgba(22, 33, 62, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(102, 126, 234, 0.2);
    border-radius: 24px;
    padding: 2.5rem;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    position: relative;
    overflow: hidden;
  }

  .login-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #667eea, #764ba2, #e21b3c, #d89e00);
  }

  .login-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 1.5rem;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 40px rgba(102, 126, 234, 0.5);
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {

    0%,
    100% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-10px);
    }
  }

  .login-icon i {
    font-size: 2.5rem;
    color: white;
  }

  .login-title {
    font-size: 2rem;
    font-weight: 700;
    color: white;
    text-align: center;
    margin-bottom: 0.5rem;
  }

  .login-subtitle {
    color: #94a3b8;
    text-align: center;
    margin-bottom: 2rem;
  }

  .form-group {
    margin-bottom: 1.25rem;
  }

  .form-label {
    display: block;
    font-size: 0.9rem;
    font-weight: 500;
    color: #cbd5e1;
    margin-bottom: 0.5rem;
  }

  .form-label i {
    color: #667eea;
    margin-right: 0.5rem;
  }

  .form-input {
    width: 100%;
    padding: 0.9rem 1rem;
    background: rgba(15, 23, 42, 0.8);
    border: 2px solid rgba(102, 126, 234, 0.2);
    border-radius: 12px;
    color: white;
    font-size: 1rem;
    transition: all 0.3s ease;
  }

  .form-input::placeholder {
    color: #64748b;
  }

  .form-input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
  }

  .login-btn {
    width: 100%;
    padding: 1rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    margin-top: 0.5rem;
  }

  .login-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
  }

  .login-btn:active {
    transform: translateY(-1px) scale(0.98);
  }

  .error-box {
    background: rgba(226, 27, 60, 0.15);
    border: 1px solid rgba(226, 27, 60, 0.4);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    color: #fca5a5;
    font-size: 0.9rem;
  }

  .divider {
    display: flex;
    align-items: center;
    margin: 1.5rem 0;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: rgba(102, 126, 234, 0.2);
  }

  .divider-text {
    padding: 0 1rem;
    color: #64748b;
    font-size: 0.85rem;
  }

  .signup-link {
    text-align: center;
    color: #94a3b8;
  }

  .signup-link a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s ease;
  }

  .signup-link a:hover {
    color: #a5b4fc;
  }
</style>

<div class="login-container">
  <div class="login-card">
    <!-- Icon -->
    <div class="login-icon">
      <i class="fas fa-gamepad"></i>
    </div>

    <!-- Header -->
    <h1 class="login-title">Welcome Back!</h1>
    <p class="login-subtitle">Sign in to continue your battle</p>

    <!-- Form -->
    <form method="post">
      {% csrf_token %}

      <!-- Username -->
      <div class="form-group">
        <label for="id_username" class="form-label">
          <i class="fas fa-user"></i>Username
        </label>
        <input type="text" name="username" id="id_username" required autofocus class="form-input"
          placeholder="Enter your username">
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="id_password" class="form-label">
          <i class="fas fa-lock"></i>Password
        </label>
        <input type="password" name="password" id="id_password" required class="form-input"
          placeholder="Enter your password">
      </div>

      <!-- Error Messages -->
      {% if form.errors %}
      <div class="error-box">
        <i class="fas fa-exclamation-circle mr-2"></i>
        Invalid username or password. Please try again.
      </div>
      {% endif %}

      <!-- Submit Button -->
      <button type="submit" class="login-btn">
        <i class="fas fa-sign-in-alt mr-2"></i>Let's Go!
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or</span>
      <div class="divider-line"></div>
    </div>

    <!-- Sign Up Link -->
    <p class="signup-link">
      New to BattleHub?
      <a href="{% url 'accounts:signup' %}">Create an account <i class="fas fa-arrow-right"></i></a>
    </p>
  </div>
</div>
{% endblock %}
